<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chip Packaging 入門 - 3D 互動教學</title>
<style>
:root{--paper:#f5f1e8;--panel:#fffdf7;--ink:#2b2b2b;--line:#e8ddd0;--accent:#b4552d;--accent-soft:#f3e6dc}
body{margin:0;font-family:ui-sans,system-ui,"Noto Sans TC",sans-serif;background:var(--paper);color:var(--ink)}
.header{height:56px;border-bottom:2px solid var(--ink);display:flex;align-items:center;padding:0 16px;background:var(--paper);justify-content:space-between}
.main{display:grid;grid-template-columns:220px 1fr 320px;height:calc(100vh - 110px)}
.left,.right{border:1px solid var(--line);background:var(--panel);margin:8px;border-radius:8px;overflow:auto;padding:12px}
.center{margin:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
canvas{width:100%;height:100%;display:block;background:repeating-linear-gradient(0deg, transparent, transparent 19px, #e8e0d0 20px), repeating-linear-gradient(90deg, transparent, transparent 19px, #e8e0d0 20px), #f5f1e8}
.btns{position:absolute;bottom:12px;right:12px;display:flex;gap:6px}
.btns button{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.tabs{display:flex;gap:8px;padding:10px;border-top:2px solid var(--ink);background:var(--paper)}
.tabs button{flex:1;padding:10px;border-radius:8px;border:2px solid var(--line);background:var(--panel);cursor:pointer;text-align:left}
.tabs button.active{border-color:var(--accent);background:var(--accent);color:white}
.part{padding:8px;border-bottom:1px dashed var(--line);cursor:pointer}
.part:hover{background:var(--accent-soft)}
.part.active{background:var(--accent-soft);border-left:3px solid var(--accent)}
</style>
</head>
<body>
<div class="header"><div><b>∞+ CHIP PACKAGING 入門</b> <span style="color:#8a7f68">· 探索 · 理解 · 动手</span></div><div style="font-size:12px">已部署到 GitHub Pages 可用</div></div>
<div class="main">
<div class="left" id="left"></div>
<div class="center" style="position:relative"><canvas id="c"></canvas><div class="btns"><button onclick="reset()">↺</button><button onclick="toggleExplode()">⧉</button></div>
<div style="position:absolute;bottom:12px;left:12px;display:flex;align-items:center;gap:8px;background:var(--panel);padding:6px 10px;border-radius:6px;border:1px solid var(--line)"><span style="font-size:12px">爆炸圖</span><input type="range" id="expl" min="0" max="100" value="0" oninput="setExpl(this.value)"><span id="explV" style="font-size:12px">0%</span></div>
</div>
<div class="right" id="right"></div>
</div>
<div class="tabs" id="tabs"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const modules=[
{id:"chip",tab:"2. 封裝晶片",sub:"QFN / BGA",desc:"封裝是晶片的盔甲。保護裸晶，同時把奈米接點轉成可焊接端子。",parts:[
{name:"塑封膠體 EMC",spec:"Tg 150°C",color:"#3c4048",y:2.5,h:0.8,w:5},
{name:"裸晶 Die",spec:"3.2×3.2mm",color:"#c9ccd4",y:1.9,h:0.4,w:2.5},
{name:"打線 Wire Bond",spec:"Au Ø25µm",color:"#d9a441",y:1.5,h:0.2,w:3.5},
{name:"封裝基板",spec:"BT 4L",color:"#2e7d4f",y:0.8,h:0.6,w:6},
{name:"焊球 BGA Ball",spec:"SAC305",color:"#d7dae2",y:0.1,h:0.3,w:0.3}
]},
{id:"osfp",tab:"3. 光收發模組",sub:"OSFP 800G",desc:"電→光→光纖→光→電。核心是 PIC 與 EIC 精密對位。",parts:[
{name:"金屬外殼",spec:"Zn合金",color:"#b9bec9",y:2.2,h:0.6,w:7},
{name:"光纖 FAU",spec:"SMF 8ch",color:"#f2c94c",y:1.4,h:0.8,w:2},
{name:"透鏡 Lens",spec:"f0.3mm",color:"#9fd4e8",y:1.4,h:1,w:1},
{name:"PIC 光子晶片",spec:"SiPh 1310nm",color:"#3a6ea5",y:1.3,h:0.4,w:2.5},
{name:"EIC DSP",spec:"7nm",color:"#6c5b9e",y:1.3,h:0.4,w:2.5},
{name:"模組 PCB",spec:"Megtron-7",y:0.6,h:0.4,w:6.5}
]},
{id:"pcb",tab:"4. PCB載板",sub:"ABF / BT",desc:"多層銅箔與雷射微孔，把高密度接點扇出。",parts:[
{name:"表面元件 SMT",spec:"0201",color:"#40454e",y:2,h:0.5,w:1.2},
{name:"防焊綠漆 PSR",spec:"Green",color:"#256d46",y:1.4,h:0.2,w:6},
{name:"表層銅",spec:"18µm",color:"#c47b3a",y:1.2,h:0.15,w:6},
{name:"介電層 ABF",spec:"35µm",color:"#d8c9a8",y:0.8,h:0.4,w:6},
{name:"內層電源面",spec:"Cu Plane",color:"#b08a5a",y:0.3,h:0.15,w:5.8}
]},
{id:"cpo",tab:"5. CPO中介層",sub:"CoWoS + COUPE",desc:"Switch ASIC + 8顆光引擎放在矽中介層上，取代長銅線。",parts:[
{name:"Switch ASIC",spec:"5nm 51.2T",color:"#2b2b2b",y:1.8,h:0.6,w:3},
{name:"光引擎 OE x8",spec:"COUPE",color:"#3a6ea5",y:1.7,h:0.5,w:1},
{name:"矽中介層",spec:"Si Interposer",color:"#7d8aa5",y:1,h:0.4,w:8},
{name:"TSV 導通孔",spec:"Ø10µm",color:"#d9a441",y:0.6,h:0.5,w:0.2},
{name:"CoWoS 基板",spec:"Organic",color:"#2e7d4f",y:0,h:0.7,w:9}
]}
];
let cur=0,explode=0,scene,camera,renderer,meshes=[],raycaster=new THREE.Vector3(),mouse=new THREE.Vector2();
function init(){
  const canvas=document.getElementById('c');
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(45, canvas.clientWidth/canvas.clientHeight, 0.1, 100);
  camera.position.set(8,6,8);
  camera.lookAt(0,1,0);
  renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  window.addEventListener('resize',()=>{renderer.setSize(canvas.clientWidth, canvas.clientHeight);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix()});
  const light=new THREE.DirectionalLight(0xffffff,0.9); light.position.set(5,10,5); scene.add(light);
  scene.add(new THREE.AmbientLight(0xffffff,0.6));
  scene.add(new THREE.GridHelper(20,20,0xe8e0d0,0xe8e0d0));
  renderModules(); selectModule(0);
  animate();
  canvas.addEventListener('click',onClick);
  let dragging=false, lastX=0,lastY=0;
  canvas.addEventListener('mousedown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});
  window.addEventListener('mouseup',()=>dragging=false);
  canvas.addEventListener('mousemove',e=>{if(!dragging)return; const dx=e.clientX-lastX, dy=e.clientY-lastY; scene.rotation.y+=dx*0.01; scene.rotation.x+=dy*0.01; lastX=e.clientX;lastY=e.clientY});
}
function clearMeshes(){meshes.forEach(m=>scene.remove(m)); meshes=[];}
function renderModules(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  modules.forEach((m,i)=>{const b=document.createElement('button'); b.textContent=m.tab+" · "+m.sub; b.className=i===cur?'active':''; b.onclick=()=>selectModule(i); t.appendChild(b);});
}
function selectModule(i){
  cur=i; explode=0; document.getElementById('expl').value=0; document.getElementById('explV').textContent='0%';
  const mod=modules[i];
  clearMeshes();
  mod.parts.forEach((p,idx)=>{
    const geom = p.name.includes('Ball')||p.name.includes('Lens')? new THREE.SphereGeometry(p.w/2,16,16) : new THREE.BoxGeometry(p.w, p.h, p.w*0.6);
    const mat=new THREE.MeshStandardMaterial({color:p.color,transparent:p.name.includes('綠漆'),opacity:p.name.includes('綠漆')?0.7:1});
    const mesh=new THREE.Mesh(geom,mat);
    mesh.position.set((idx%2===0? -0.3:0.3)*idx*0.1, p.y, 0);
    mesh.userData={idx,part:p};
    meshes.push(mesh); scene.add(mesh);
  });
  // extra balls for BGA
  if(mod.id==='chip'){ for(let x=-2;x<=2;x++) for(let z=-2;z<=2;z++){ const s=new THREE.Mesh(new THREE.SphereGeometry(0.15,12,12), new THREE.MeshStandardMaterial({color:"#d7dae2"})); s.position.set(x*0.8,0.1,z*0.8); meshes.push(s); scene.add(s);} }
  updateLeft(); updateRight();
  renderModules();
}
function updateLeft(){
  const mod=modules[cur]; const left=document.getElementById('left');
  left.innerHTML=`<b>元件</b><div style="font-size:11px;color:#888;margin:4px 0">視圖中有 ${mod.parts.length} 個</div>`+mod.parts.map((p,i)=>`<div class="part" onclick="selectPart(${i})" id="part-${i}"><b>${p.name}</b><div style="font-size:11px;color:#666">${p.spec}</div></div>`).join('');
}
function updateRight(){
  const mod=modules[cur];
  document.getElementById('right').innerHTML=`<b>${mod.tab}</b><p style="font-size:13px;line-height:1.6;margin-top:8px">${mod.desc}</p><div style="margin-top:12px;padding:10px;background:#2b2b2b;color:#f0e7d3;border-radius:6px;font-family:monospace;font-size:11px">SPEC := ${mod.sub}<br>PARTS := ${mod.parts.length}<br>FOR INTERVIEW</div><p style="font-size:11px;color:#888;margin-top:12px">點選左側或3D模型查看細節。爆炸圖滑桿可分離各層。</p><div id="sel" style="margin-top:12px"></div>`;
}
function selectPart(i){
  document.querySelectorAll('.part').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('part-'+i); if(el) el.classList.add('active');
  const p=modules[cur].parts[i];
  document.getElementById('sel').innerHTML=`<div style="border:1px solid #b4552d;padding:8px;border-radius:6px"><b>${p.name}</b><div style="font-size:12px">${p.spec}</div><div style="font-size:12px;margin-top:4px">此結構在面試可說明製程與功能。</div></div>`;
  meshes.forEach(m=>{ if(m.userData.part && m.userData.part.name===p.name) m.material.emissive=new THREE.Color(0x443300); else if(m.material.emissive) m.material.emissive.set(0x000000); });
}
function setExpl(v){ explode=Number(v); document.getElementById('explV').textContent=v+'%'; meshes.forEach((m,i)=>{ const base=modules[cur].parts[m.userData.idx]?.y||m.position.y; m.position.y=base+explode*0.03*i; });}
function toggleExplode(){ const nv=explode>0?0:100; document.getElementById('expl').value=nv; setExpl(nv);}
function reset(){ scene.rotation.set(0,0,0); setExpl(0); document.getElementById('expl').value=0;}
function onClick(e){
  const canvas=document.getElementById('c'); const rect=canvas.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1; mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  const ray=new THREE.Raycaster(); ray.setFromCamera(mouse,camera); const hits=ray.intersectObjects(meshes);
  if(hits[0] && hits[0].object.userData.idx!==undefined) selectPart(hits[0].object.userData.idx);
}
function animate(){ requestAnimationFrame(animate); renderer.render(scene,camera); }
window.selectModule=selectModule; window.selectPart=selectPart; window.setExpl=setExpl; window.toggleExplode=toggleExplode; window.reset=reset;
init();
</script>
</body>
</html>
